    <!--
      ── FONTS (CRITICAL — do NOT use @import in CSS) ──
      1. preconnect opens the socket to Google early, saving ~200ms RTT
      2. Both fonts combined in ONE <link> = one request instead of two
      3. display=swap prevents render-blocking — text shows in fallback font
         while the custom font loads, then swaps in seamlessly
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap"
    />

    <!-- ── JSON-LD: Organization ── -->
    <script type="application/ld+json">

      "@type": "ProfessionalService",
      "name": "Devholix",
      "url": "https://devholix.com",
      "description": "Elite web design and development agency engineering premium digital experiences for bold brands.",

      "areaServed": "Worldwide",
      "priceRange": "$999+",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "abdullah@devholix.com",
        "telephone": "+923104993978",

    </script>

    <!-- ── JSON-LD: FAQPage (Google rich snippets) ── -->
    <script type="application/ld+json">

        },

          "acceptedAnswer": { "@type": "Answer", "text": "100%. Every build is fully responsive across all devices and screen sizes." }

          "acceptedAnswer": { "@type": "Answer", "text": "50% upfront to begin, 50% on delivery. Elite Builds can use a three-stage payment schedule." }
        }
      ]
    }
    </script>
  </head>
